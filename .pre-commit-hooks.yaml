# Pre-commit integration. In a consuming repo, add to .pre-commit-config.yaml:
#
#   - repo: https://github.com/Arthur920/Staleguard
#     rev: v0.5.0
#     hooks:
#       - id: staleguard
#
# The hook runs on every commit: drift usually comes from a code change (a
# rename, a deleted script), not a doc edit, so it scans the whole repo.
- id: staleguard
  name: staleguard (doc drift)
  description: Check docs against code for coherence drift.
  entry: staleguard check
  language: rust
  always_run: true
  pass_filenames: false
