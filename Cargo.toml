[package]
name = "staleguard"
version = "0.3.0"
edition = "2021"
description = "Sanity-check CLAUDE.md, project docs, and code against each other for coherence drift."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Arthur920/Staleguard"
homepage = "https://github.com/Arthur920/Staleguard"
keywords = ["documentation", "drift", "coherence", "tree-sitter", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "staleguard"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
regex = "1"
# Per-file parsing in `CodeIndex::build` is embarrassingly parallel (each file
# gets its own tree-sitter parser); rayon fans it across cores.
rayon = "1"
# `rc` lets `Arc<str>` serialize as its string: `RefEdge` interns its endpoints
# into shared `Arc<str>`s so a large repo's reference graph doesn't duplicate
# every long qualified name across millions of edges (the litellm OOM).
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Optional `.staleguard.toml` config (exclude globs, verdict suppression).
toml = { version = "0.8", default-features = false, features = ["parse"] }
tree-sitter = "0.26"
tree-sitter-tags = "0.26"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
streaming-iterator = "0.1.9"

[profile.release]
strip = true
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
